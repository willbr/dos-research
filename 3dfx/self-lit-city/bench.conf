[sdl]
autolock=true
mouse_wheel_key=0
clip_mouse_button=none
fullscreen=false
windowresolution=1280x960
output=opengl
[dosbox]
memsize=32
[cpu]
integration device=true
core=dynamic
cputype=pentium
cycles=fixed 100000
[voodoo]
voodoo_card=opengl
voodoo_maxmem=false
glide=false
[autoexec]
@echo off
mount c .
c:
set SST_GLIDE_NO_SPLASH=1
city.exe /bench
exit
